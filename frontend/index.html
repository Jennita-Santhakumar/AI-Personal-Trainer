<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Fitness Platform</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f8f8f6; color: #1a1a18; }
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f1efe8;
      --color-background-tertiary: #e8e6df;
      --color-background-info: #e6f1fb;
      --color-background-success: #eaf3de;
      --color-background-warning: #faeeda;
      --color-background-danger: #fcebeb;
      --color-text-primary: #1a1a18;
      --color-text-secondary: #5f5e5a;
      --color-text-tertiary: #888780;
      --color-text-info: #0c447c;
      --color-text-success: #27500a;
      --color-text-warning: #633806;
      --color-text-danger: #791f1f;
      --color-border-tertiary: rgba(0,0,0,0.1);
      --color-border-secondary: rgba(0,0,0,0.18);
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
      --border-radius-xl: 16px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", "Fira Code", monospace;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #18181a; color: #e8e6df; }
      :root {
        --color-background-primary: #1c1c1e;
        --color-background-secondary: #2c2c2e;
        --color-background-tertiary: #18181a;
        --color-background-info: #042c53;
        --color-background-success: #173404;
        --color-background-warning: #412402;
        --color-background-danger: #501313;
        --color-text-primary: #e8e6df;
        --color-text-secondary: #b4b2a9;
        --color-text-tertiary: #888780;
        --color-text-info: #85b7eb;
        --color-text-success: #97c459;
        --color-text-warning: #ef9f27;
        --color-text-danger: #f09595;
        --color-border-tertiary: rgba(255,255,255,0.1);
        --color-border-secondary: rgba(255,255,255,0.18);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
