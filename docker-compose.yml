# AI Fitness Platform v6 — Docker Compose
# Usage: docker compose up --build
# First start pulls llama3.2:3b (~2GB) — fits in RTX 3050 4GB VRAM
# Frontend: http://localhost:3000
# API docs: http://localhost:8100/docs
# Demo login: demo@fitnessplatform.com / Demo1234!
services:
  # ── Postgres ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness_platform
    ports:
      - "5499:5432"
    volumes:
      - fitness_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness_platform"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # ── pgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    volumes:
      - fitness_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── InfluxDB (metrics / time-series) ────────────────────────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    ports:
      - "8187:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: fitness
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-change-in-production
    volumes:
      - fitness_influxdata:/var/lib/influxdb2
    restart: unless-stopped

  # ── RustFS (S3-compatible local file storage) ────────────────────────────────
  rustfs-volume-permissions:
    image: alpine
    volumes:
      - fitness_miniodata:/data/rustfs0
      - fitness_miniodata1:/data/rustfs1
      - fitness_miniodata2:/data/rustfs2
      - fitness_miniodata3:/data/rustfs3
    command: sh -c "chown -R 10001:10001 /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3"
    restart: "no"

  minio:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - fitness_miniodata:/data/rustfs0
      - fitness_miniodata1:/data/rustfs1
      - fitness_miniodata2:/data/rustfs2
      - fitness_miniodata3:/data/rustfs3
    restart: unless-stopped

  # ── Ollama: local LLM server ────────────────────────────────────────────────
 

  # ── DB migration (runs once, exits) ──────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8100:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - coach_memory:/app/coach_memory
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Celery worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: celery -A tasks worker --loglevel=info --concurrency=2 -Q default
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - coach_memory:/app/coach_memory
    restart: unless-stopped

  # ── DB seeder: creates demo user on first run ─────────────────────────────────
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: python scripts/seed_db.py
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  # ── React frontend (nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fitness_pgdata:
  fitness_redisdata:
  fitness_influxdata:
  fitness_miniodata:
  fitness_miniodata1:
  fitness_miniodata2:
  fitness_miniodata3:
  fitness_ollama_models:
  coach_memory:
  
  
